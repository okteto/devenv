version: '3.7'

services:
  dotnetcore8:
    build:
      context: .
      dockerfile: dotnetcore/Dockerfile
      args:
        VERSION: "8.0"
      tags:
        - okteto/dotnetcore:8
        - ghcr.io/okteto/dotnetcore:8
  dotnetcore10:
    build:
      context: .
      dockerfile: dotnetcore/Dockerfile
      args:
        VERSION: "10.0"
      tags:
        - okteto/dotnetcore:10
        - ghcr.io/okteto/dotnetcore:10

  
