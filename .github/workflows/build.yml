name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [golang, node]
        include:
          - service: golang
            compose_file: docker-compose.golang.yml
            platforms: linux/amd64,linux/arm64
          - service: node
            compose_file: docker-compose.node.yml
            platforms: linux/amd64,linux/arm64

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Context for Buildx
        id: buildx-context
        run: |
          docker context create builders

      - name: Set up Docker Builder
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          install: true
          endpoint: builders

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Build ${{ matrix.service }}
        run: |
          echo "Building ${{ matrix.service }}" && docker buildx bake -f ${{ matrix.compose_file }} \
            --set "*.platform=${{ matrix.platforms }}"
